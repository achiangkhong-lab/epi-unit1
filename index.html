<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ภารกิจหน่วยสอบสวนโรค</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: an outbreak-investigation case file — a 6-stop mission track on top, one "case card" in the middle, a status ticker below. */
:root{
  --paper:#EAF0F1; --card:#FFFFFF; --ink:#132029; --muted:#5A6B74;
  --alert:#D1452A; --teal:#0E6B70; --amber:#D99A12; --line:#C9D5D8;
  --good:#1F8A4C; --bad:#C0392B;
  --display:"Chakra Petch", "IBM Plex Sans Thai", system-ui, sans-serif;
  --body:"IBM Plex Sans Thai", "Sarabun", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A20; --card:#16252D; --ink:#E6EEF0; --muted:#97A9B1;
    --alert:#F06A4E; --teal:#3FB3B8; --amber:#F0B73A; --line:#2A3E48;
    --good:#4CC27E; --bad:#F06A5E; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A20; --card:#16252D; --ink:#E6EEF0; --muted:#97A9B1;
  --alert:#F06A4E; --teal:#3FB3B8; --amber:#F0B73A; --line:#2A3E48;
  --good:#4CC27E; --bad:#F06A5E; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
body{min-height:100%;padding:16px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-family:var(--body);font-weight:500;color:var(--muted);font-size:.8rem;letter-spacing:0}
.brand b{font-size:1.45rem;line-height:1.15;text-wrap:balance}
.brand b span{color:var(--alert)}
.hud{display:flex;gap:8px;font-family:var(--display);font-variant-numeric:tabular-nums}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:4px 10px;font-size:.9rem;white-space:nowrap}
.chip strong{font-size:1.05rem}
/* mission track */
.track{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.stop{border-top:4px solid var(--line);padding-top:6px;font-size:.72rem;color:var(--muted);line-height:1.25}
.stop .n{font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--muted)}
.stop.done{border-color:var(--teal)} .stop.done .n{color:var(--teal)}
.stop.now{border-color:var(--alert)} .stop.now .n,.stop.now{color:var(--ink)}
@media (max-width:520px){.stop span.t{display:none}}
/* case card */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:14px;position:relative}
.stamp{font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.08em;color:var(--alert);border:2px solid var(--alert);border-radius:4px;padding:2px 8px;justify-self:start;transform:rotate(-2deg)}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.9rem} h2{font-size:1.3rem}
p{margin:0}
.muted{color:var(--muted)}
.opts{display:grid;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;text-align:left;transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--teal)}
.opt.sel{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,var(--card))}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt:disabled{cursor:default}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bin{border:2px dashed var(--line);border-radius:8px;padding:8px;min-height:92px;display:flex;flex-direction:column;gap:6px;background:transparent;text-align:left}
.bin.armed{border-color:var(--teal);border-style:solid}
.bin h3{margin:0;font-family:var(--display);font-size:.95rem}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.92rem;text-align:left}
.tag.sel{border-color:var(--alert);box-shadow:0 0 0 2px color-mix(in srgb,var(--alert) 30%,transparent)}
.tag.right{border-color:var(--good)} .tag.wrong{border-color:var(--bad);text-decoration:line-through}
.blank{display:inline-block;min-width:92px;border-bottom:2px solid var(--teal);text-align:center;font-weight:700;color:var(--teal);padding:0 4px}
.blank.right{color:var(--good);border-color:var(--good)} .blank.wrong{color:var(--bad);border-color:var(--bad)}
.seq{display:grid;gap:6px}
.seq .slot{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;min-height:42px;display:flex;gap:10px;align-items:center}
.seq .slot b{font-family:var(--display);color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.go{background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:11px 20px;font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.02em}
.go:hover{background:var(--teal)}
.go:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:10px 16px}
.fb{border-left:4px solid var(--teal);background:var(--paper);padding:10px 14px;border-radius:0 8px 8px 0}
.fb.ok{border-color:var(--good)} .fb.no{border-color:var(--bad)}
.fb strong{font-family:var(--display)}
input[type=text]{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
label{font-weight:500}
.ticker{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;font-size:.9rem}
.bar .b{height:10px;background:var(--paper);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .b i{display:block;height:100%;background:var(--teal)}
.bar .b i.low{background:var(--alert)}
.bar span:last-child{font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:520px){.bar{grid-template-columns:110px 1fr 48px}}
.fig{margin:0 0 12px;display:grid;gap:6px}
.fig img{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
.fig figcaption{font-size:.82rem;color:var(--muted)}
.pre .opt.right,.pre .opt.wrong{border-color:var(--line);background:var(--paper)}
.pre .opt.picked{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,var(--card))}
.pre .tag.right,.pre .tag.wrong{border-color:var(--line);text-decoration:none}
.pre .blank.right,.pre .blank.wrong{color:var(--teal);border-color:var(--teal)}
.pre .hud .chip:not(#clock){display:none}
.modebar{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.06em;color:var(--card);background:var(--teal);border-radius:4px;padding:3px 10px;justify-self:start}
.big{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1;color:var(--alert);font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .card{animation:in .28s ease-out}
  @keyframes in{from{transform:translateY(6px)}to{transform:none}}
}
.sendmsg{font-weight:600;margin:.4rem 0}.sendmsg.ok{color:var(--good)}.sendmsg.no{color:var(--bad)}
</style>
</head>

// ---------- mode: #pretest = แบบทดสอบก่อนเรียน (ไม่เฉลย ไม่แสดงคะแนนระหว่างทำ)
const PRE = location.hash === '#pretest';
const API = 'https://script.google.com/macros/s/AKfycby3HDuEorq4XKsyCy6z9fTWFWPglijcsFwxoGPLIn4e-aZ-VfMD6CfF2ftqg_Fjz9vKRg/exec';
if (PRE) document.documentElement.classList.add('pre');
// ---------- state
const total = M.reduce((s,m)=>s+m.items.reduce((t,it)=>t+units(it),0),0);
function units(it){ return it.type==='mcq'||it.type==='order'?1:(it.type==='fill'?it.answer.length:it.cards.length); }
let S = { phase:'intro', name:'', m:0, i:0, score:0, streak:0, best:0, start:0, elapsed:0, byM:{}, answered:false };
let ui = {}; // per-item scratch
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function hud(){
  $('modebar').textContent = PRE ? 'แบบทดสอบก่อนเรียน' : 'แบบทดสอบหลังเรียน';
  $('score').textContent=S.score; $('streak').textContent=S.streak;
  const t = S.start? Math.floor(((S.phase==='end'?S.elapsed:Date.now()-S.start))/1000):0;
  $('clock').textContent = String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  $('track').innerHTML = M.map((m,k)=>`<div class="stop ${S.phase==='end'||k<S.m?'done':(k===S.m&&S.phase==='play'?'now':'')}"><span class="n">${k<6?'0'+m.id:'!!'}</span> <span class="t">${m.short}</span></div>`).join('');
}
setInterval(hud,1000);

function credit(mid, got, of){
  const b = S.byM[mid] || (S.byM[mid]={got:0,of:0}); b.got+=got; b.of+=of;
  for(let k=0;k<of;k++){
    if(k<got){ S.streak++; S.best=Math.max(S.best,S.streak); S.score+=10+(S.streak>=3?5:0); }
    else S.streak=0;
  }
}

// ---------- screens
function render(){
  hud();
  if(S.phase==='intro') return intro();
  if(S.phase==='end') return end();
  const m=M[S.m], it=m.items[S.i];
  const head = `<div class="stamp">${S.m<6?'ภารกิจที่ '+m.id+' / 6':'ภารกิจพิเศษ'} · ด่าน ${S.i+1}/${m.items.length}</div><h2>${esc(m.title)}</h2><p>${esc(it.q)}</p>`;
  $('stage').innerHTML = `<section class="card" aria-live="polite">${head}<div id="body"></div><div id="fb"></div><div class="row" id="ctl"></div></section>`;
  ({mcq,sort,order,fill})[it.type](it);
  window.claude?.hot?.snapshot?.(()=>S);
}
function intro(){
  $('stage').innerHTML = `<section class="card">
    <div class="stamp">แฟ้มคดีเปิดใหม่</div>
    <h1>${PRE?'เช็กความพร้อมก่อนออกปฏิบัติการ':'คุณได้รับมอบหมายให้เข้าร่วมหน่วยสอบสวนโรค'}</h1>
    <p>${PRE?'แบบทดสอบก่อนเรียน 6 ภารกิจตามหัวข้อในหน่วยที่ 1 และเคสด่วนอีก 1 เคส ใช้เวลาประมาณ 10 นาที ตอบตามความเข้าใจของตนเอง ระบบจะไม่เฉลยและไม่แสดงคะแนนระหว่างทำ ไม่ต้องคำนวณ':'แบบทดสอบหลังเรียน 6 ภารกิจตามหัวข้อในหน่วยที่ 1 และเคสด่วนอีก 1 เคส ใช้เวลาประมาณ 10 นาที แต่ละด่านมีเฉลยและคำอธิบายหลังตอบ ไม่ต้องคำนวณ'}</p>
    <div style="display:grid;gap:6px"><label for="nm">ชื่อนักศึกษาหรือชื่อกลุ่ม</label><input type="text" id="nm" autocomplete="off" placeholder="เช่น กลุ่ม 5 หรือ ชื่อ-สกุล" value="${esc(S.name)}"></div>
    <div class="row"><button class="go" id="startBtn">เริ่มภารกิจ</button><span class="muted">มีทั้งหมด ${total} คำตอบย่อย</span></div>
  </section>`;
  $('startBtn').onclick=()=>{ S.name=$('nm').value.trim()||'ไม่ระบุชื่อ'; S.phase='play'; S.start=Date.now(); S.m=0;S.i=0; render(); };
}
function feedback(ok, part, why){
  if (PRE) { // no answers or explanations before class
    $('fb').innerHTML = `<div class="fb"><strong>บันทึกคำตอบแล้ว</strong><p>เฉลยและคำอธิบายจะแสดงในแบบทดสอบหลังเรียน</p></div>`;
    $('tick').textContent = 'บันทึกคำตอบแล้ว';
  } else
  $('fb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><strong>${ok?'ถูกต้อง':'ยังไม่ถูกทั้งหมด'}${part?' · '+part:''}</strong><p>${esc(why)}</p></div>`;
  if (!PRE) $('tick').textContent = ok? 'ข้อมูลยืนยันแล้ว เดินหน้าต่อ' : 'ทบทวนคำอธิบาย แล้วไปต่อ';
  const last = S.m===M.length-1 && S.i===M[S.m].items.length-1;
  $('ctl').innerHTML = `<button class="go" id="next">${last?'ดูผลการสอบสวน':'ด่านต่อไป'}</button>`;
  $('next').onclick=next; $('next').focus();
}
function next(){
  const m=M[S.m];
  if(S.i<m.items.length-1) S.i++; else if(S.m<M.length-1){ S.m++; S.i=0; } else { S.phase='end'; S.elapsed=Date.now()-S.start; }
  render();
}
// MCQ
function mcq(it){
  const order = shuffle(it.opts.map((t,k)=>k));
  const fig = it.img ? `<figure class="fig"><img src="${it.img}" alt="${esc(it.imgAlt||'')}"><figcaption>${esc(it.cap||'')}</figcaption></figure>` : '';
  $('body').innerHTML = fig + `<div class="opts">${order.map(k=>`<button class="opt" data-k="${k}">${esc(it.opts[k])}</button>`).join('')}</div>`;
  $('body').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k, ok=k===it.a;
    $('body').querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.k===it.a)x.classList.add('right');});
    if(!ok) b.classList.add('wrong');
    if(PRE) b.classList.add('picked');
    credit(M[S.m].id, ok?1:0, 1); hud(); feedback(ok,'',it.why);
  });
}
// SORT: tap a card, then tap a bin
function sort(it){
  ui = { place:{}, sel:null, cards:shuffle(it.cards.map((c,k)=>k)) };
  const draw = ()=>{
    const pool = ui.cards.filter(k=>ui.place[k]===undefined);
    $('body').innerHTML = `<p class="muted">แตะการ์ด แล้วแตะแฟ้มที่ต้องการ (แตะการ์ดในแฟ้มเพื่อนำกลับ)</p>
      <div class="pool">${pool.map(k=>`<button class="tag ${ui.sel===k?'sel':''}" data-c="${k}">${esc(it.cards[k][0])}</button>`).join('') || '<span class="muted">จัดครบทุกการ์ดแล้ว</span>'}</div>
      <div class="bins">${it.bins.map((b,j)=>`<button class="bin ${ui.sel!==null?'armed':''}" data-b="${j}"><h3>${esc(b)}</h3>${ui.cards.filter(k=>ui.place[k]===j).map(k=>`<span class="tag" data-back="${k}">${esc(it.cards[k][0])}</span>`).join('')}</button>`).join('')}</div>`;
    $('body').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ ui.sel = ui.sel===+b.dataset.c?null:+b.dataset.c; draw(); });
    $('body').querySelectorAll('.bin').forEach(b=>b.onclick=(e)=>{
      const back=e.target.closest('[data-back]'); if(back){ delete ui.place[+back.dataset.back]; draw(); return; }
      if(ui.sel===null) return; ui.place[ui.sel]=+b.dataset.b; ui.sel=null; draw(); });
    $('ctl').innerHTML = `<button class="go" id="chk" ${Object.keys(ui.place).length<it.cards.length?'disabled':''}>ตรวจคำตอบ</button>`;
    $('chk').onclick=()=>{
      let got=0; it.cards.forEach((c,k)=>{ if(ui.place[k]===c[1]) got++; });
      $('body').querySelectorAll('[data-back]').forEach(t=>{ const k=+t.dataset.back; t.classList.add(ui.place[k]===it.cards[k][1]?'right':'wrong'); if(!PRE && ui.place[k]!==it.cards[k][1]) t.title='ควรอยู่ในแฟ้ม '+it.bins[it.cards[k][1]]; });
      $('body').querySelectorAll('.bin').forEach(b=>b.disabled=true);
      const wrongList = it.cards.filter((c,k)=>ui.place[k]!==c[1]).map(c=>`“${c[0]}” → ${it.bins[c[1]]}`);
      credit(M[S.m].id, got, it.cards.length); hud();
      feedback(got===it.cards.length, `ถูก ${got}/${it.cards.length}`, it.why + (wrongList.length? ' | เฉลยที่ผิด: '+wrongList.join('; '):''));
    };
  };
  draw();
}
// ORDER
function order(it){
  ui = { seq:[], opts:shuffle(it.steps.map((s,k)=>k)) };
  const draw=()=>{
    $('body').innerHTML = `<div class="pool">${ui.opts.filter(k=>!ui.seq.includes(k)).map(k=>`<button class="tag" data-k="${k}">${esc(it.steps[k])}</button>`).join('')}</div>
      <div class="seq">${it.steps.map((s,p)=>`<div class="slot"><b>${p+1}</b><span>${ui.seq[p]!==undefined?esc(it.steps[ui.seq[p]]):''}</span></div>`).join('')}</div>`;
    $('body').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ ui.seq.push(+b.dataset.k); draw(); });
    $('ctl').innerHTML = `<button class="go" id="chk" ${ui.seq.length<it.steps.length?'disabled':''}>ตรวจคำตอบ</button> <button class="ghost" id="clr">เริ่มเรียงใหม่</button>`;
    $('clr').onclick=()=>{ui.seq=[];draw();};
    $('chk').onclick=()=>{
      const ok = ui.seq.every((k,p)=>k===p);
      if(!PRE) $('body').querySelectorAll('.slot').forEach((s,p)=>{ s.style.borderColor = ui.seq[p]===p?'var(--good)':'var(--bad)'; });
      credit(M[S.m].id, ok?1:0, 1); hud();
      feedback(ok,'', 'ลำดับที่ถูก: '+it.steps.join(' → ')+' | '+it.why);
    };
  };
  draw();
}
// FILL (word bank, fills blanks in order)
function fill(it){
  ui = { got:[], bank:shuffle(it.bank) };
  const draw=()=>{
    let html=''; it.text.forEach((t,k)=>{ html+=esc(t); if(k<it.answer.length) html+=` <span class="blank">${ui.got[k]?esc(ui.got[k]):'&nbsp;'}</span> `; });
    $('body').innerHTML = `<p style="font-size:1.08rem;line-height:2">${html}</p><div class="pool">${ui.bank.filter(w=>!ui.got.includes(w)).map(w=>`<button class="tag" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>`;
    $('body').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ if(ui.got.length<it.answer.length){ ui.got.push(b.dataset.w); draw(); } });
    $('ctl').innerHTML = `<button class="go" id="chk" ${ui.got.length<it.answer.length?'disabled':''}>ตรวจคำตอบ</button> <button class="ghost" id="clr">ล้างคำตอบ</button>`;
    $('clr').onclick=()=>{ui.got=[];draw();};
    $('chk').onclick=()=>{
      const okAt = it.answer.map((a,k)=>ui.got[k]===a);
      (it.swap||[]).forEach(g=>{ // interchangeable blanks: right if the word belongs to the group and is not repeated
        const want=g.map(k=>it.answer[k]), used=[];
        g.forEach(k=>{ const w=ui.got[k]; okAt[k]= want.includes(w) && !used.includes(w); used.push(w); });
      });
      let got=0; $('body').querySelectorAll('.blank').forEach((b,k)=>{ const ok=okAt[k]; if(ok)got++; b.classList.add(ok?'right':'wrong'); });
      $('body').querySelectorAll('.tag').forEach(b=>b.disabled=true);
      credit(M[S.m].id, got, it.answer.length); hud();
      feedback(got===it.answer.length, `ถูก ${got}/${it.answer.length}`, 'คำที่ถูก: '+it.answer.join(', ')+((it.swap||[]).length?' (“การกระจาย” และ “ปัจจัยกำหนด” สลับที่กันได้)':'')+' | '+it.why);
    };
  };
  draw();
}
// END
function end(){
  const got = Object.values(S.byM).reduce((s,b)=>s+b.got,0);
  const pct = Math.round(got/total*100);
  const rank = pct>=90?'หัวหน้าทีมสอบสวนโรค':pct>=80?'เจ้าหน้าที่หน่วยสอบสวนโรค (SRRT)':pct>=60?'ผู้ช่วยนักสอบสวนโรค':'นักสอบสวนโรคฝึกหัด';
  const t = Math.floor(S.elapsed/1000), tt = Math.floor(t/60)+' นาที '+(t%60)+' วินาที';
  const weak = M.filter(m=>{const b=S.byM[m.id]; return b && b.got/b.of<0.8 && m.id<7;}).map(m=>m.title);
  const summary = `ภารกิจหน่วยสอบสวนโรค (${PRE?'ก่อนเรียน':'หลังเรียน'}) | ${S.name} | คะแนน ${S.score} | ถูก ${got}/${total} (${pct}%) | ${rank} | เวลา ${tt}` + (weak.length?` | ควรทบทวน: ${weak.join(', ')}`:'');
  $('stage').innerHTML = `<section class="card">
    <div class="stamp">ปิดแฟ้มคดี</div>
    <div class="row" style="align-items:flex-end;justify-content:space-between">
      <div><p class="muted">${esc(S.name)} · ${PRE?'ก่อนเรียน':'หลังเรียน'}</p><h1>${PRE?'ทำแบบทดสอบก่อนเรียนเสร็จแล้ว':rank}</h1></div>
      <div style="text-align:right"><div class="big">${pct}%</div><p class="muted">ถูก ${got}/${total}${PRE?'':' · '+S.score+' คะแนน'} · ${tt}</p></div>
    </div>
    <p>${PRE?'บันทึกผลก่อนเรียนแล้ว แถบสีแดงคือหัวข้อที่ควรอ่านในเอกสารประกอบการสอนก่อนเข้าชั้นเรียน':(pct>=80?'ผ่านเกณฑ์ร้อยละ 80 พร้อมเรียนหน่วยที่ 2 ดัชนีอนามัย':'ยังไม่ถึงเกณฑ์ร้อยละ 80 ทบทวนหัวข้อที่แถบสีแดง แล้วเล่นใหม่ได้')}</p>
    <div class="bars">${M.map(m=>{const b=S.byM[m.id]||{got:0,of:1}; const p=Math.round(b.got/b.of*100); return `<div class="bar"><span>${m.id<7?m.id+'. ':''}${esc(m.short)}</span><div class="b"><i class="${p<80?'low':''}" style="width:${p}%"></i></div><span>${p}%</span></div>`;}).join('')}</div>
    ${weak.length?`<div class="fb no"><strong>หัวข้อที่ควรทบทวนในเอกสารประกอบการสอน</strong><p>${weak.map(esc).join(' · ')}</p></div>`:''}
    <div class="row"><button class="go" id="copy">คัดลอกผลเพื่อส่งอาจารย์</button>${PRE?'':'<button class="ghost" id="again">เล่นใหม่</button>'}<span class="muted" id="cmsg"></span></div>
    <p id="sendmsg" class="sendmsg"></p>
    <p class="muted" style="font-size:.85rem">ถ้าคัดลอกไม่ได้ ให้แคปหน้าจอนี้ส่งอาจารย์แทน</p>
  </section>`;
  sendScore(got,pct);
  $('copy').onclick=async()=>{ try{ await navigator.clipboard.writeText(summary); $('cmsg').textContent='คัดลอกแล้ว วางในช่องส่งงานของรายวิชาได้เลย'; }catch(e){ $('cmsg').textContent='คัดลอกไม่ได้ในอุปกรณ์นี้ กรุณาแคปหน้าจอ'; } };
  if($('again')) $('again').onclick=()=>{ S={ phase:'intro', name:S.name, m:0, i:0, score:0, streak:0, best:0, start:0, elapsed:0, byM:{} }; render(); };
  window.claude?.hot?.snapshot?.(()=>S);
}

function sendScore(got,pct){
  const el=$('sendmsg'); if(!el) return;
  if(S.sent){ el.textContent='✓ ส่งคะแนนถึงอาจารย์แล้ว'; el.className='sendmsg ok'; return; }
  if(!/^https?:/.test(API)) return;
  el.className='sendmsg'; el.textContent='กำลังส่งคะแนนถึงอาจารย์…';
  const body=JSON.stringify({ name:S.name, score:S.score, pct, got, total, secs:Math.floor(S.elapsed/1000),
    topics:M.map(m=>{const b=S.byM[m.id]; return b&&b.of?Math.round(b.got/b.of*100):0;}),
    round:new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'}), mode:PRE?'pre':'post' });
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body})
    .then(r=>r.json()).then(j=>{ if(!j.ok) throw 0; S.sent=true; el.className='sendmsg ok'; el.textContent='✓ ส่งคะแนนถึงอาจารย์แล้ว'; })
    .catch(()=>{ el.className='sendmsg no'; el.innerHTML='ส่งคะแนนไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้ว <button class="ghost" id="resend">ส่งอีกครั้ง</button>'; $('resend').onclick=()=>sendScore(got,pct); });
}
function start(d){ if(d && d.phase){ S=d; } render(); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
